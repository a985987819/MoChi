[package]
name = "mochi"
version = "0.9.0"
description = "Mochi 麻薯 —— AI 桌宠小助手"
authors = ["laoduan"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标与菜单（v0.1.0 起应用常驻托盘）
# macos-private-api：macOS 透明窗口必需（对应 tauri.conf.json 的 macOSPrivateApi）
# protocol-asset：asset:// 协议（v0.2.0 起宠物素材从用户目录加载，对应 assetProtocol 配置）
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
# single-instance：阻止重复启动；二次启动时唤起已有实例的宠物窗
tauri-plugin-single-instance = "2"
# store：键值持久化（v0.3.0 起存提供商设置/API Key；v0.7.0 起存计时器配置）
tauri-plugin-store = "2"
# sql：SQLite（v0.5.0 起存会话协议历史/待办/长期记忆，四表 DDL 见 learning/04 §3.1）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# notification：系统通知（v0.7.0 起站立提醒/番茄钟/自定义提醒）
tauri-plugin-notification = "2"
# window-state：窗口位置持久化（v0.9.0 P0-04）。只开 POSITION 标志：
# VISIBLE 会把退出时可见的 chat 窗在下次启动时弹出来（chat 设计是隐藏启动），
# SIZE 对固定尺寸窗口无意义、DECORATIONS/FULLSCREEN 与本应用无关
tauri-plugin-window-state = "2"
# global-shortcut：全局快捷键（v0.9.0 P1-13，默认 Ctrl/Cmd+Shift+M 开聊天）。
# 注册在 Rust 侧完成（OS 级钩子必须原生），前端经事件开关——不需要 JS 包与 capability
tauri-plugin-global-shortcut = "2"
# autostart：开机自启（v0.9.0 P1-14，默认关——不默认自启是底线）。
# Windows=注册表 Run 键 / macOS=LaunchAgent / Linux=desktop 文件，插件统一封装
tauri-plugin-autostart = "2"
# user-idle：跨平台"距上次输入时长"查询（v0.7.0 在场检测，learning/08 §3.1）
user-idle = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows 专属：查主屏工作区（SPI_GETWORKAREA），首启定位避开任务栏（v0.9.0 P0-04）。
# 版本对齐依赖树里既有的 windows 0.62（tao/tauri 已引入），不新增编译单元
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
