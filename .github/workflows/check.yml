# 只检查，不打包分发、不创建 tag/Release；日常 main 推送也能验证原生代码。
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # 安装包收集器使用 Node 真实文件系统测试；Windows 额外覆盖安装器被占用后的回滚。
      - run: pnpm test:packaging
      - run: pnpm build
      # Windows runner 自动配置 MSVC；本机开发仍必须走 scripts/vsenv.cmd。
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
