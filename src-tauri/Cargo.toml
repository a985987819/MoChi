[package]
name = "mochi"
version = "0.1.0"
description = "Mochi 麻薯 —— AI 桌宠小助手"
authors = ["laoduan"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标与菜单（v0.1.0 起应用常驻托盘）
# macos-private-api：macOS 透明窗口必需（对应 tauri.conf.json 的 macOSPrivateApi）
# protocol-asset：asset:// 协议（v0.2.0 起宠物素材从用户目录加载，对应 assetProtocol 配置）
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
# single-instance：阻止重复启动；二次启动时唤起已有实例的宠物窗
tauri-plugin-single-instance = "2"
# store：键值持久化（v0.3.0 起存提供商设置/API Key；v0.7.0 起存计时器配置）
tauri-plugin-store = "2"
# sql：SQLite（v0.5.0 起存会话协议历史/待办/长期记忆，四表 DDL 见 learning/04 §3.1）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
