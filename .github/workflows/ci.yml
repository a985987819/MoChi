# Mochi CI —— 质量门禁（P2-14）：push main / PR 时跑前端三件套 + Rust check。
#
# 与 release.yml 的分工：本工作流**只做检查，不构建安装包、不发布**——
# 发布链路只在 release.yml（tag 触发，部署纪律见 AGENTS.md §2）。
#
# 设计：
# - 前端门禁在 ubuntu（快、便宜）；cargo check 在 windows（本项目的目标平台，
#   windows 依赖如 user-idle/windows crate 只有在 windows runner 上才被编译到）
# - 版本约定与 release.yml 对齐：pnpm 12 + Node 22
# - rust-cache 按 src-tauri 键缓存，冷启动约 5~8 分钟，热启动 1~2 分钟

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {} # 手动触发用于演练

jobs:
  frontend:
    name: 前端门禁（check / test / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm check

      - name: 单元测试
        run: pnpm test

      - name: 前端构建
        run: pnpm build

  rust:
    name: Rust 门禁（cargo check）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
